name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - run: make tools
      - run: make lint
      - run: make vuln
      - run: make depgate
      - run: make sizegate
      - run: make filegate
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the browser VM and run the conformance suite through it
        run: make vmtest

  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      # The store's tests take up to nine minutes on the macOS runner
      # under the race detector, and Go stops a package after ten: the
      # limit is said here, so that a slow runner fails no pull request.
      - name: Test with the race detector
        if: runner.os != 'Windows'
        run: go test -race -count=1 -timeout 20m ./...
      - name: Test
        if: runner.os == 'Windows'
        run: go test -count=1 ./...
      - name: Build
        run: go build ./...

  # The library of C (ADR-0101), built and tried from a program of C on
  # each system the tests run on, and the Python client over HTTP and
  # through it. Its module needs cgo, so it is not in the tests of the
  # core.
  library:
    name: library / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Vet the module of the library
        working-directory: cabi
        env:
          CGO_ENABLED: "1"
        run: go vet ./...
      - name: Test it, which builds the library and runs a program of C against it
        working-directory: cabi
        env:
          CGO_ENABLED: "1"
          # "must": the program of C is compiled and run, or this step
          # fails; a skipped test would not show in this log.
          FADODB_CABI: must
        run: go test -count=1 ./...
      # The Python client (ADR-0101, step C): the same tests over HTTP,
      # against a fadodb-core serve they start, and in the same process,
      # through the library. The machine's own Python runs them: the
      # client needs nothing but Python's own library.
      - name: Build the library and fadodb-core for the tests of the Python client
        run: |
          case "$RUNNER_OS" in
            Windows) library=fadodb-core.dll program=fadodb-core.exe ;;
            macOS) library=libfadodb-core.dylib program=fadodb-core ;;
            *) library=libfadodb-core.so program=fadodb-core ;;
          esac
          (cd cabi && CGO_ENABLED=1 go build -buildmode=c-shared -o "../bin/$library" .)
          CGO_ENABLED=0 go build -o "bin/$program" ./cmd/fadodb-core
          echo "FADODB_LIBRARY=bin/$library" >> "$GITHUB_ENV"
          echo "FADODB_PROGRAM=bin/$program" >> "$GITHUB_ENV"
      - name: The Python client, over HTTP and in the same process
        env:
          # "must": both ways run, or this step fails.
          FADODB_PYTHON: must
        run: |
          python=$(command -v python3 || command -v python)
          "$python" --version
          "$python" -m unittest discover -s clients/py/tests -v

  # fadodb, the program with the analytical engine, built and tried on
  # each system it is released for; the DuckDB module is tested whole on
  # one of them (.github/workflows/programs.yml).
  programs:
    name: programs
    uses: ./.github/workflows/programs.yml

  image:
    name: image / ${{ matrix.machine }}
    runs-on: ${{ matrix.machine }}
    strategy:
      fail-fast: false
      matrix:
        # A machine of each kind a release publishes the images for: the
        # chapter is played against an image that runs there, and the
        # image for the other kind is built by this one's compiler.
        machine: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build the images for containers and play their chapter of the manual against them
        # fadodb and fadodb-core, for the machines a release publishes
        # them for; nothing is published here
        # (docs/manual/in-a-container.md).
        run: scripts/image.sh check

  changes:
    name: changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      measured: ${{ steps.diff.outputs.measured }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - id: diff
        name: Does the pull request change what the benchmark gate measures?
        # The gate runs only when a file that goes into the measured
        # programs changed; the script says which file that was, or that
        # there was none.
        run: |
          measured=$(scripts/benchgate.sh --needed "origin/${{ github.base_ref }}")
          echo "measured=$measured" >> "$GITHUB_OUTPUT"

  bench:
    name: bench
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.measured == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go install golang.org/x/perf/cmd/benchstat@latest
      - name: Compare benchmarks against the base branch
        # The short form (ADR-0012, since 2026-11-15): allocations and
        # bytes as ever, time refused only when a benchmark is more than
        # half slower. The full form, five placements and 5% on time, is
        # run on the machine of whoever changes a hot path, before the
        # push.
        run: scripts/benchgate.sh --quick origin/${{ github.base_ref }}
