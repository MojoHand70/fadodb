name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - run: make tools
      - run: make lint
      - run: make vuln
      - run: make depgate
      - run: make sizegate

  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Test with the race detector
        if: runner.os != 'Windows'
        run: go test -race -count=1 ./...
      - name: Test
        if: runner.os == 'Windows'
        run: go test -count=1 ./...
      - name: Build
        run: go build ./...

  analytics:
    name: analytics / ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Test the DuckDB module with cgo
        working-directory: analytics
        env:
          CGO_ENABLED: "1"
        run: |
          go vet ./...
          go test -count=1 ./...

  changes:
    name: changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      measured: ${{ steps.diff.outputs.measured }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - id: diff
        name: Does the pull request change what the benchmark gate measures?
        # The gate takes half an hour, so it runs only when a file that
        # goes into the measured programs changed; the script says which
        # file that was, or that there was none.
        run: |
          measured=$(scripts/benchgate.sh --needed "origin/${{ github.base_ref }}")
          echo "measured=$measured" >> "$GITHUB_OUTPUT"

  bench:
    name: bench
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.measured == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go install golang.org/x/perf/cmd/benchstat@latest
      - name: Compare benchmarks against the base branch
        run: scripts/benchgate.sh origin/${{ github.base_ref }}
