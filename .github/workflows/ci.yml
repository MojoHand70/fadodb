name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - run: make tools
      - run: make lint
      - run: make vuln
      - run: make depgate
      - run: make sizegate
      - run: make filegate
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the browser VM and run the conformance suite through it
        run: make vmtest

  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      # The store's tests take up to nine minutes on the macOS runner
      # under the race detector, and Go stops a package after ten: the
      # limit is said here, so that a slow runner fails no pull request.
      - name: Test with the race detector
        if: runner.os != 'Windows'
        run: go test -race -count=1 -timeout 20m ./...
      - name: Test
        if: runner.os == 'Windows'
        run: go test -count=1 ./...
      - name: Build
        run: go build ./...

  # fadodb, the program with the analytical engine, built and tried on
  # each system it is released for; the DuckDB module is tested whole on
  # one of them (.github/workflows/programs.yml).
  programs:
    name: programs
    uses: ./.github/workflows/programs.yml

  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build the image for containers and play its chapter of the manual against it
        # For the machines a release publishes it for; nothing is
        # published here (docs/manual/in-a-container.md).
        run: scripts/image.sh check

  changes:
    name: changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      measured: ${{ steps.diff.outputs.measured }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - id: diff
        name: Does the pull request change what the benchmark gate measures?
        # The gate runs only when a file that goes into the measured
        # programs changed; the script says which file that was, or that
        # there was none.
        run: |
          measured=$(scripts/benchgate.sh --needed "origin/${{ github.base_ref }}")
          echo "measured=$measured" >> "$GITHUB_OUTPUT"

  bench:
    name: bench
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.measured == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go install golang.org/x/perf/cmd/benchstat@latest
      - name: Compare benchmarks against the base branch
        # The short form (ADR-0012, since 2026-11-15): allocations and
        # bytes as ever, time refused only when a benchmark is more than
        # half slower. The full form, five placements and 5% on time, is
        # run on the machine of whoever changes a hot path, before the
        # push.
        run: scripts/benchgate.sh --quick origin/${{ github.base_ref }}
