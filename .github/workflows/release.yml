name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # fadodb, the program with the analytical engine, is built first, on a
  # machine of each system, tried there, and kept: a release is made
  # only when every one of them is there, so that no release is without
  # the program its name stands for (ADR-0089, step 6).
  programs:
    uses: ./.github/workflows/programs.yml
    with:
      version: ${{ github.ref_name }}
      keep: true

  # The library of C and the Python package are Phase 9's, and are
  # first released with v0.9.0: v0.8.0 is Phase 8's release alone (the
  # owner's word of 2026-11-28), so a tag of the 0.8 line builds neither,
  # attaches neither and publishes nothing on PyPI, whose job waits for
  # this one.
  library:
    if: ${{ !startsWith(github.ref_name, 'v0.8.') }}
    uses: ./.github/workflows/library.yml
    with:
      version: ${{ github.ref_name }}
      keep: true

  goreleaser:
    needs: [programs, library]
    # The library is skipped on a tag of the 0.8 line, and the release
    # is made without it; a library that failed stops the release.
    if: ${{ !cancelled() && needs.programs.result == 'success' && (needs.library.result == 'success' || needs.library.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go test -count=1 ./...
      # The browser VM, built and checked, for goreleaser to attach to
      # the release beside the binaries (ADR-0029).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make vmtest
      # The archives of fadodb, for GoReleaser to attach beside the ones
      # of fadodb-core it builds itself, and to checksum with them. The
      # folder is one git does not look at, as GoReleaser asks.
      - uses: actions/download-artifact@v8
        with:
          pattern: fadodb-*
          path: bin/programs
          merge-multiple: true
      - name: Every system has its fadodb
        run: |
          ls -l bin/programs
          for system in linux_amd64 linux_arm64 darwin_arm64 darwin_amd64 windows_amd64; do
            ls bin/programs/fadodb_*_"$system".* >/dev/null
          done
      - uses: actions/download-artifact@v8
        if: ${{ needs.library.result == 'success' }}
        with:
          pattern: fadodb-core-library-*
          path: bin/library
          merge-multiple: true
      - name: Every system has its two libraries and its wheel
        if: ${{ needs.library.result == 'success' }}
        run: |
          ls -l bin/library
          for system in linux_amd64 linux_arm64 darwin_arm64 darwin_amd64 windows_amd64; do
            ls bin/library/fadodb-core-library_*_"$system".* >/dev/null
            ls bin/library/fadodb-library_*_"$system".* >/dev/null
          done
          for platform in manylinux_2_*_x86_64 manylinux_2_*_aarch64 macosx_12_0_arm64 macosx_12_0_x86_64 win_amd64 any; do
            ls bin/library/fadodb-*-py3-none-$platform.whl >/dev/null
          done
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image-on-arm:
    # The images are published for two kinds of machine, and this job
    # plays their chapter on the one the publishing job is not: so each
    # image has run, on a machine of its own kind, before it is
    # published.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Check the images on ARM
        run: scripts/image.sh check

  image:
    # The images for containers, published under the version of the tag
    # and under no other name (docs/manual/in-a-container.md): fadodb,
    # with the analytical engine, and fadodb-core beside it as
    # <version>-core. A job of its own: the binaries of a release
    # neither wait for it nor fail with it. They are published only
    # after their chapter of the manual was played against them.
    needs: image-on-arm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Sign in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Check the images and publish them
        run: scripts/image.sh push "${GITHUB_REF_NAME#v}"

  npm:
    # The browser VM on npm, as fadodb-vm (ADR-0029). A job of its own,
    # as the image's is: the release neither waits for it nor fails with
    # it. The package's major version is the bytecode format version, so
    # a release whose VM is unchanged keeps its version, and this job
    # then publishes nothing. npm trusts this workflow by its trusted
    # publisher setting: no token is kept anywhere.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
          registry-url: https://registry.npmjs.org
      - run: make vmtest
      - name: Publish the version unless npm has it already
        run: |
          version="$(node -p "require('./web/vm/dist/package.json').version")"
          if npm view "fadodb-vm@${version}" version >/dev/null 2>&1; then
            echo "fadodb-vm ${version} is on npm already; nothing to publish"
          else
            npm publish ./web/vm/dist --access public
          fi

  pypi:
    # The Python client on PyPI, as fadodb (ADR-0101, step D; the owner's
    # word of 2026-11-27): the wheels the library job made and tried, one
    # for each system with the library inside and one for every system
    # without it. A job of its own, as npm's is: the release neither waits
    # for it nor fails with it. PyPI trusts this workflow, for the
    # environment pypi, by its trusted publisher setting: no token is kept
    # anywhere. A version PyPI has already is passed over, so a run again
    # publishes nothing twice.
    needs: library
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/fadodb/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: fadodb-core-library-*
          path: bin/library
          merge-multiple: true
      - name: Only the wheels go to PyPI
        run: |
          mkdir -p dist
          mv bin/library/fadodb-*.whl dist/
          ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
