# GoReleaser v2 configuration. Runs on every v* tag through
# .github/workflows/release.yml and publishes binaries with checksums.
#
# A release has two programs (ADR-0089). fadodb-core, in pure Go, is
# built here, for every system from one machine. fadodb, the same
# program with the analytical engine, is built before this runs, on a
# machine of each system DuckDB is built for, and its archives stand in
# bin/programs: they are attached and checksummed with the rest.
version: 2

project_name: fadodb

before:
  hooks:
    - go mod tidy

builds:
  - id: fadodb-core
    main: ./cmd/fadodb-core
    binary: fadodb-core
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }} -X main.date={{ .Date }}

archives:
  - id: default
    formats: [tar.gz]
    name_template: 'fadodb-core_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  # The archives of fadodb and the browser VM's three files are
  # checksummed with the binaries.
  extra_files:
    - glob: ./bin/programs/fadodb_*.tar.gz
    - glob: ./bin/programs/fadodb_*.zip
    - glob: ./bin/library/fadodb-core-library_*.tar.gz
    - glob: ./bin/library/fadodb-core-library_*.zip
    - glob: ./bin/library/fadodb-*.whl
    - glob: ./web/vm/dist/fadodb-vm.js
    - glob: ./web/vm/dist/fadodb-vm.iife.js
    - glob: ./web/vm/dist/fadodb-vm.d.ts

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^ci:'
      - '^chore:'

release:
  # Every release before 1.0 is a pre-release. "auto" would only flag
  # versions with a suffix such as -rc1, which misrepresents 0.x tags.
  prerelease: true
  # The browser VM, attached to every release as ADR-0029 says: the ES
  # module, the classic script and the declarations, which the release
  # workflow builds and checks before goreleaser runs; and fadodb, the
  # program with the analytical engine, for each system it is built for.
  extra_files:
    - glob: ./bin/programs/fadodb_*.tar.gz
    - glob: ./bin/programs/fadodb_*.zip
    - glob: ./bin/library/fadodb-core-library_*.tar.gz
    - glob: ./bin/library/fadodb-core-library_*.zip
    - glob: ./bin/library/fadodb-*.whl
    - glob: ./web/vm/dist/fadodb-vm.js
    - glob: ./web/vm/dist/fadodb-vm.iife.js
    - glob: ./web/vm/dist/fadodb-vm.d.ts
  footer: |
    Pre-release. See ROADMAP.md for what is implemented and what is not.
