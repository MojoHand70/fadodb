# GoReleaser v2 configuration. Runs on every v* tag through
# .github/workflows/release.yml and publishes binaries with checksums.
version: 2

project_name: fadodb

before:
  hooks:
    - go mod tidy

builds:
  - id: fadodb
    main: ./cmd/fadodb
    binary: fadodb
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }} -X main.date={{ .Date }}

archives:
  - id: default
    formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^ci:'
      - '^chore:'

release:
  prerelease: auto
  footer: |
    Pre-release. See ROADMAP.md for what is implemented and what is not.
